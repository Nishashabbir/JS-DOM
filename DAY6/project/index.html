<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Cart Architecture</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      display: flex;
      gap: 30px;
    }

    .left { flex: 2; }
    .right {
      flex: 1;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-count {
      background: black;
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
    }

    .card button {
      margin-top: 10px;
      padding: 6px 10px;
      border: none;
      background: black;
      color: white;
      cursor: pointer;
    }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }

    .cart-item button {
      margin-top: 5px;
      background: crimson;
      border: none;
      color: white;
      padding: 5px 8px;
      cursor: pointer;
    }

    .total {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- basically render products and render cart are created  , add to cart and remove , update almost every function is created and then there is a centralized function render app that is called  -->

  <div class="left">
    <div class="top-bar">
      <h1>Products</h1>
      <div class="cart-count">Cart: <span id="cart-count">0</span></div>
    </div>

    <div id="product-container" class="grid"></div>
  </div>

  <div class="right">
    <h2>Cart</h2>
    <div id="cart-container"></div>
    <div class="total">Total: Rs. <span id="total">0</span></div>
  </div>

  <script>
    //  STATE (single source of truth)
    const products = [
      { id: 1, title: "Wireless Headphones", price: 4500, image: "image.png" },
      { id: 2, title: "Smart Watch", price: 3200, image: "smartwatch.webp" },
      { id: 3, title: "Bluetooth Speaker", price: 2800, image: "speakers.jpg" },
      { id: 4, title: "Gaming Mouse", price: 1500, image: "gamingmouse.webp" }
    ];

    let cart = [];

    //  DOM
    const productContainer = document.getElementById("product-container");
    const cartContainer = document.getElementById("cart-container");
    const cartCountEl = document.getElementById("cart-count");
    const totalEl = document.getElementById("total");

    //  CENTRAL RENDER FLOW
    function renderApp() {
      renderProducts();
      renderCart();
      updateCartCount();
    }

    //  PURE RENDER FUNCTIONS
    function renderProducts() {
      let html = "";

      products.forEach(p => {
        html += `
          <div class="card">
            <img src="${p.image}">
            <h3>${p.title}</h3>
            <p>Rs. ${p.price}</p>
            <button class="add" data-id="${p.id}">Add to Cart</button>
          </div>
        `;
      });

      productContainer.innerHTML = html;
    }

    function renderCart() {
      let html = "";

      cart.forEach(item => {
        html += `
          <div class="cart-item">
            <h4>${item.title}</h4>
            <p>Price: Rs. ${item.price}</p>
            <p>Qty: ${item.quantity}</p>
            <button class="remove" data-id="${item.id}">Remove</button>
          </div>
        `;
      });

      cartContainer.innerHTML = html;

      const total = cart.reduce((sum, item) => {
        return sum + item.price * item.quantity;
      }, 0);

      totalEl.innerText = total;
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      cartCountEl.innerText = count;
    }

    // LOGIC (STATE ONLY)
    function addToCart(id) {
      const existing = cart.find(item => item.id == id);

      if (existing) {
        existing.quantity++;
      } else {
        const product = products.find(p => p.id == id);
        cart.push({ ...product, quantity: 1 });
      }

      renderApp();
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id != id);
      renderApp();
    }

    //  CLEAN EVENT HANDLERS
    productContainer.addEventListener("click", (e) => {
      if (e.target.matches(".add")) {
        addToCart(e.target.dataset.id);
      }
    });

    cartContainer.addEventListener("click", (e) => {
      if (e.target.matches(".remove")) {
        removeFromCart(e.target.dataset.id);
      }
    });

    //  INIT
    renderApp();
  </script>

</body>
</html>
