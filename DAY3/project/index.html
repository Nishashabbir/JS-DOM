<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product UI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      text-align: center;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
    }

    .card h3 {
      margin: 10px 0;
    }

    .card button {
      padding: 8px 12px;
      border: none;
      background: black;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Our Products</h1>

  <div id="product-container" class="grid"></div>

  <script>
    const products = [
      {
        id: 1,
        title: "Wireless Headphones",
        price: 4500,
        image: "image.png"
      },
      {
        id: 2,
        title: "Smart Watch",
        price: 3200,
        image: "smartwatch.webp"
      },
      {
        id: 3,
        title: "Bluetooth Speaker",
        price: 2800,
        image: "speakers.jpg"
      },
      {
        id: 4,
        title: "Gaming Mouse",
        price: 1500,
        image: "gamingmouse.webp"
      }
    ];

    const container = document.getElementById("product-container");

    function renderProducts() {
      let html = "";

      products.forEach(product => { 
        // here we directly applied the html on every element through for each loop 
        html += `
          <div class="card">
            <img src="${product.image}" alt="${product.title}">
            <h3>${product.title}</h3>
            <p>Rs. ${product.price}</p>
            <button>Add to Cart</button>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    renderProducts();
  </script>




</body>
</html>
