// if you use getElementById() method it will return the first element with the specified id and if there are multiple elements with the same id it will only access the first one and ignore the rest. so in our case we have two h1 tags with the same id "i1" but only the first one will be accessed and manipulated by js and the second one will remain unchanged. this is why it is important to use unique ids for each element in html to avoid confusion and ensure that js can access and manipulate the correct elements.
