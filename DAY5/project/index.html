<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Cart System</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      display: flex;
      gap: 30px;
    }

    .left {
      flex: 2;
    }

    .right {
      flex: 1;
      background: white;
      padding: 15px;
      border-radius: 10px;
      height: fit-content;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: contain;
    }

    .card button {
      margin-top: 10px;
      padding: 6px 10px;
      border: none;
      background: black;
      color: white;
      cursor: pointer;
    }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }

    .cart-item button {
      margin-top: 5px;
      background: crimson;
      border: none;
      color: white;
      padding: 5px 8px;
      cursor: pointer;
    }

    .total {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="left">
    <h1>Products</h1>
    <div id="product-container" class="grid"></div>
  </div>

  <div class="right">
    <h2>Cart</h2>
    <div id="cart-container"></div>
    <div class="total">Total: Rs. <span id="total">0</span></div>
  </div>

  <script>
    //  STATE
    const products = [
      { id: 1, title: "Wireless Headphones", price: 4500, image: "image.png" },
      { id: 2, title: "Smart Watch", price: 3200, image: "smartwatch.webp" },
      { id: 3, title: "Bluetooth Speaker", price: 2800, image: "speakers.jpg" },
      { id: 4, title: "Gaming Mouse", price: 1500, image: "gamingmouse.webp" }
    ];

    let cart = [];

    //  DOM
    const productContainer = document.getElementById("product-container");
    const cartContainer = document.getElementById("cart-container");
    const totalEl = document.getElementById("total");

    //  Render Products
    function renderProducts() {
      let html = "";

      products.forEach(p => {
        html += `
          <div class="card">
            <img src="${p.image}">
            <h3>${p.title}</h3>
            <p>Rs. ${p.price}</p>
            <button class="add" data-id="${p.id}">Add to Cart</button>
          </div>
        `;
      });

      productContainer.innerHTML = html;
    }

    //  Add to Cart Logic
    function addToCart(id) {
      const product = products.find(p => p.id == id);

      const existing = cart.find(item => item.id == id);

      if (existing) {
        existing.quantity++;
//  without quantity  wouldn’t track how many items are added
// You might end up with duplicates instead of increasing quantity
      } else {
        cart.push({ ...product, quantity: 1 });
        // you are dynamically creating a property or key of an object , quantity of const products objects 
      }
// ...product (spread operator)
// This copies all properties from product

//above  if-else means 
// note : If item exists:
//  Increase its quantity
// If item doesn’t exist:
//  Copy product + add quantity: 1 and store it
      renderCart();


    }

    //  Render Cart (MAIN POWER)
    function renderCart() {
      let html = "";

      cart.forEach(item => {
        html += `
          <div class="cart-item">
            <h4>${item.title}</h4>
            <p>Price: Rs. ${item.price}</p>
            <p>Qty: ${item.quantity}</p>
            <button class="remove" data-id="${item.id}">Remove</button>
          </div>
        `;
      });

      cartContainer.innerHTML = html;

      //  Total Calculation ,  // total payment of the shopping 
      const total = cart.reduce((sum, item) => {
        return sum + item.price * item.quantity;
      }, 0);
     

      totalEl.innerText = total;
    }

    //  Event Delegation — Products
    productContainer.addEventListener("click", function(e) {
      if (e.target.classList.contains("add")) {
        const id = e.target.dataset.id;
        addToCart(id);
      }
    });

    //  Event Delegation — Cart
    cartContainer.addEventListener("click", function(e) {
      if (e.target.classList.contains("remove")) {
        const id = e.target.dataset.id;

        cart = cart.filter(item => item.id != id);

        renderCart();
      }
    });

    //  INIT
    renderProducts();
  </script>

</body>
</html>
