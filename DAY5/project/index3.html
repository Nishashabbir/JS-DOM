<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More refine code for E-Commerce </title>
    <style>
.card{
    text-align: center;
    border: solid 1px rgb(212, 210, 210);
    border-radius: 20px;
    box-shadow: 0 5px 15px;
    margin: 20px;
    width: 400px;
    height: 300px;
    padding: 20px;
}
.card img{
    border-radius: 20px;
    
     width: 100%;
      height: 140px;
      object-fit: contain;
}

.wrapper{            
    /* until you give the both divs space then they will appear only  */
    display: flex;
}



    </style>





</head>
<body>
    
<div class="wrapper">
    <div id="left"> 
        <h1>our products </h1>
        <div id="product-container"></div>

    </div>

<div id="right">
    <h1>your cart </h1>
    <div id="cart-container"></div>
    <p id="total-price">Total Price : </p>
</div>
</div>

    <script>

 const products=[// fixed database 
      { id: 1, title: "Wireless Headphones", price: 4500, image: "image.png" },
      { id: 2, title: "Smart Watch", price: 3200, image: "smartwatch.webp" },
      { id: 3, title: "Bluetooth Speaker", price: 2800, image: "speakers.jpg" },
      { id: 4, title: "Gaming Mouse", price: 1500, image: "gamingmouse.webp" }
    ]

let cart=[]
    const Container=document.getElementById("product-container")
    
const cartContainer=document.getElementById("cart-container")
const total= document.getElementById("total-price");
    function renderProducts(){
        let html=" " ;
        products.forEach(product=> {
           html+= `
<div class="card">
    <img src="${product.image}" alt="">
    <h3>${product.title}</h3>
    <p>${product.price}</p>
    <button class="add-to-cart" data-id="${product.id}">Add to Cart </button>
</div>
            `       
        });

        Container.innerHTML=html;


    }

    renderProducts()

    // now render these products as well as  render the products that are added to the cart 
 function renderCart() {
      let html = "";

      cart.forEach(item => {
        html += `
          <div class="cart-item">
            <h4>${item.title}</h4>
            <p>Price: Rs. ${item.price}</p>
            
             <button class="decrease" data-id="${item.id}">-</button>
    <span>Qty: ${item.quantity}</span>  
    <button class="increase" data-id="${item.id}">+</button>

            <button class="remove" data-id="${item.id}">Remove From Cart </button>
          </div>
        `;
      });

      cartContainer.innerHTML = html;
const sum=cart.reduce((total , item)=>{
    return total += item.quantity * item.price
}, 0)

total.innerText="Total Price = " +sum ;


     }


   function addToCart(id){
    const product= products.find((p=>p.id==id))
    const existing=cart.find(c=>c.id==id)
    if (existing){
        alert("Already added ")
    }
    else{
        cart.push({...product, quantity: 1});
        renderCart();
    }
   
   }


    Container.addEventListener("click" , function(e){
        const id= e.target.dataset.id ;
       if (e.target.classList.contains("add-to-cart")){
        // if that button is clicked , take its id and pass it to the add to cart function 
        addToCart(id)
       }
       
    })

    
    cartContainer.addEventListener("click" , function(e){
        const id= e.target.dataset.id ;
        // const id = Number(e.target.dataset.id);
        if (e.target.classList.contains("remove")){
        // if that button is clicked , take its id and pass it to the add to cart function 
       cart= cart.filter(c=>c.id!=id);
        renderCart()
       }

       if (e.target.classList.contains("increase")){
    //    its behavior will be the same as the add to cart , if increased is clicked it will find which cart item is clicked and only that cart item quantity is increased 
        const item = cart.find(c=>c.id==id)  
        if (item){
            //  only if the item is there , if that comes out to be true 
            item.quantity++;
        }  }
       if (e.target.classList.contains("decrease")){
    //    its behavior will be the same as the add to cart , if increased is clicked it will find which cart item is clicked and only that cart item quantity is increased 
        const item = cart.find(c=>c.id==id)  
        if (item){
            item.quantity--;
             if (item.quantity <= 0){
                cart = cart.filter(c => c.id != id);
                // less than zero id will be -1 if we remove it there is no item left to dispaly so , now items is there automatically button also vanishes 
            }
        }  

       }
        renderCart();
       
    });











    </script>
</body>
</html>
