<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Mini E-commerce </title>
  <!-- we are now using state here  , the state that will record how many have been added  -->
  <!-- COMPLETE PROJECT — Product Listing + Add to Cart -->

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart {
      background: black;
      color: white;
      padding: 10px 15px;
      border-radius: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: contain;
    }

    .card h3 {
      margin: 10px 0;
    }

    .card button {
      padding: 8px 12px;
      border: none;
      background: black;
      color: white;
      cursor: pointer;
    }

    /* Button animation */
.card button {
  padding: 10px 15px;
  border: none;
  background: black;
  color: white;
  cursor: pointer;
  border-radius: 5px;
  transition: all 0.3s ease;
}

/* Hover effect */
.card button:hover {
  background: #333;
  transform: scale(1.05);
}

/* Click animation */
.card button:active {
  transform: scale(0.9);
}

/* Added state */
.card button.added {
  background: green;
}
  </style>
</head>

<body>


  <!-- now we are adding  a cart to the product listing , product container will have the all the listed products while cart will have those products that the customer selected  -->

  <div class="top-bar">

    <h1>Our Products </h1>

<div class="cart"> 🛒 Cart: <span id="cart-count">0</span></div>
  </div>

  <div id="product-container" class="grid"></div>




  <script>

    const products = [
      { id: 1, title: "Wireless Headphones", price: 4500, image: "image.png" },
      { id: 2, title: "Smart Watch", price: 3200, image: "smartwatch.webp" },
      { id: 3, title: "Bluetooth Speaker", price: 2800, image: "speakers.jpg" },
      { id: 4, title: "Gaming Mouse", price: 1500, image: "gamingmouse.webp" }

    ]

    // now we are creating the html of the products 

    const container = document.getElementById("product-container");
    const cartCount = document.getElementById("cart-count");

let cart=[]
    function productRender() {
       let html = " ";
      products.forEach(product => {

       
        html += `<div class="card">
  <img src="${product.image}" alt="${product.title}">
  <h3>${product.title}</h3>
  <p>${product.price}</p>
  <button class="add-to-cart" data-id="${product.id}">Add to Cart </button>
</div>`
});
container.innerHTML=html;
// innerText will write the plain text like div , and the whole code as text , so we will use innerHtml here 
    }
      // we have made the product listing 
      // now on clicking the add to cart button ,only that product should be added , and count should be increased , so where should we collect the selected products , a cart 

function updateCartUI(){
  cartCount.innerText=cart.length
}

container.addEventListener("click" , function (e) {
  if (e.target.classList.contains("add-to-cart")){ 
    // contains is the method of classList
    //  clicking the button , two things should happen that product should be added to cart through the id of that product and then the cart count , the ui should be updated 
  
    let id=e.target.getAttribute("data-id");
    const product = products.find(p=> p.id==id)//it returns the product that matches with the id of product throught this p arrow functions that returns true or false and then with this find() method finds the products 
  //  we compare the product in products list and the product which is clicked 
    cart.push(product)
    updateCartUI()
    // Button animation
const btn = e.target;
btn.classList.add("added");
btn.innerText = "Added ✔";

// Optional: disable button after click
btn.disabled = true; 
// disabled is the property of button , it becomes unclickable when turned green 

// Reset after 1.5 seconds
setTimeout(() => {
  // reset properties of button 
  btn.classList.remove("added"); 
  btn.innerText = "Add to Cart";
  btn.disabled = false; 
  // now it becomes clickable again after 1.5 seconds
}, 1500);


    console.log("Event: " , e)
  }
  

  
})
    

    productRender()

  </script>













</body>

</html>
